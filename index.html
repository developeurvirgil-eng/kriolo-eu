<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Kriolo v13</title><style>body{background:#000;color:#fff;font-family:sans-serif;padding:20px}textarea{width:100%;height:120px;background:#111;color:#fff;border:2px solid #333;border-radius:10px;padding:12px;font-size:18px}button{width:100%;padding:16px;background:#f5d547;color:#000;font-weight:900;font-size:18px;border:0;border-radius:10px;margin-top:10px}#saida{background:#111;border:1px solid #333;border-radius:10px;padding:15px;margin-top:15px;min-height:80px;font-size:20px}</style></head><body><h1 style="color:#f5d547">KRIOLO.EU v13</h1><textarea id="entrada" placeholder="Bom dia como estas?"></textarea><button onclick="traduzir()">TRADUZIR AGORA →</button><div id="saida">Resultado aqui...</div><script>function traduzir(){var txt=document.getElementById('entrada').value;if(!txt){alert('Escreve!');return;}var t=txt.toLowerCase();var d={'bom dia como estas':'Bom dia, modi bu sta?','bom dia':'Bom dia','boa tarde':'Boa tardi','boa noite':'Boa noti','como estas':'modi bu sta','tudo bem':'tudu dretu','obrigado':'Obrigadu','onde é a tua casa':'Undi ki e bu kaza?','eu gosto de ti':'N gosta di bo','eu':'N','tu':'bo','casa':'kaza','amor':'amor','obrigado pelo teu apoio':'Obrigadu pa bu apoiu'};var res=t;Object.keys(d).sort((a,b)=>b.length-a.length).forEach(k=>{res=res.split(k).join(d[k])});document.getElementById('saida').innerText=res;}</script></body></html>
